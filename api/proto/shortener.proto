edition = "2023";

package shortener;

option go_package = "github.com/dmitrymack/go-url-shortener.git/api/proto;shortenerpb";

import "google/protobuf/empty.proto";

// ShortenerService mirrors a subset of the HTTP API over gRPC. The caller
// is identified by a JWT in the "authorization" metadata key.
service ShortenerService {
  rpc ShortenURL (URLShortenRequest) returns (URLShortenResponse);
  rpc ExpandURL (URLExpandRequest) returns (URLExpandResponse);
  rpc ListUserURLs (google.protobuf.Empty) returns (UserURLsResponse);
}

message URLShortenRequest {
  string url = 1;
}

message URLShortenResponse {
  string result = 1;
}

message URLExpandRequest {
  string id = 1;
}

message URLExpandResponse {
  string result = 1;
}

message UserURLsResponse {
  repeated URLData url = 1;
}

message URLData {
  string short_url = 1;
  string original_url = 2;
}
